<!DOCTYPE html>
<!-- MocGoogle.com Free Tool: 3D Depth-Approach Endless Square — Free to use and share -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>MocGoogle.com — 3D Depth Box</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #f8fafc;
      --muted: #94a3b8;
      --panel: #1e293b;
      --panel-line: #475569;
      --accent: #38bdf8;
    }

    body {
      background: radial-gradient(circle at 50% 42%, #111b36 0%, #05070f 82%);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      overflow: hidden;
      touch-action: none;
    }

    header { text-align: center; z-index: 10; }
    header h1 { font-size: 1.4rem; letter-spacing: 0.5px; color: var(--accent); }
    header p { font-size: 0.85rem; color: var(--muted); margin-top: 5px; }

    /* ---------- Stage & depth cards ---------- */
    .stage {
      position: relative;
      width: clamp(290px, 84vw, 430px);
      height: clamp(290px, 84vw, 430px);
      perspective: 900px;
      margin: auto;
    }

    /* faint tunnel rings behind the cards, so the deep reads as deep */
    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(56, 189, 248, 0.10);
      border-radius: 18px;
      pointer-events: none;
    }
    .stage::before { transform: scale(0.62); }
    .stage::after  { transform: scale(0.34); border-color: rgba(56, 189, 248, 0.06); }

    .card {
      position: absolute;
      inset: 0;
      background: rgba(13, 18, 36, 0.97);
      border: 2px solid var(--accent);
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.22), inset 0 0 20px rgba(56, 189, 248, 0.15);
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .card.front {
      transform: translateZ(0px) scale(1);
      opacity: 1;
      z-index: 4;
      pointer-events: auto;
    }

    .card.deep {
      transform: translateZ(-550px) scale(0.45);
      opacity: 0.25;
      z-index: 3;
    }

    .card.deep-2 {
      transform: translateZ(-800px) scale(0.28);
      opacity: 0.10;
      z-index: 2;
    }

    .card.hidden-deep {
      transform: translateZ(-1000px) scale(0.16);
      opacity: 0;
      z-index: 1;
    }

    .card.passed {
      transform: translateZ(380px) scale(1.45);
      opacity: 0;
      z-index: 5;
    }

    .tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold; }
    .card h2 { font-size: 1.5rem; line-height: 1.2; color: #fff; margin: 10px 0; }
    .card p { font-size: 0.95rem; line-height: 1.55; color: #cbd5e1; }

    .btn {
      display: block;
      padding: 13px 12px;
      min-height: 44px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      text-align: center;
      text-decoration: none;
      color: #060812;
    }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    /* ---------- Controls ---------- */
    .controls-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 10; }
    .controls { display: flex; gap: 12px; align-items: center; }
    .nav-btn {
      background: var(--panel);
      color: #fff;
      border: 1px solid var(--panel-line);
      padding: 12px 20px;
      min-height: 48px;
      min-width: 110px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .nav-btn:active { background: var(--accent); color: #060812; }
    .nav-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .counter { font-size: 0.85rem; color: var(--muted); min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }

    .dots { display: flex; gap: 7px; }
    .dots button {
      width: 36px; height: 36px;
      padding: 0;
      background: transparent;
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .dots button::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #334155;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .dots button.on::before { background: var(--accent); transform: scale(1.35); }
    .dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 50%; }

    @media (max-width: 380px) {
      .nav-btn { min-width: 96px; padding: 12px 14px; }
      .card { padding: 22px 20px; }
      .card h2 { font-size: 1.35rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition-duration: 0.15s; }
    }
  </style>
</head>
<body>

  <header>
    <h1>MocGooGLE.coM</h1>
    <p>Scroll or swipe to pull the next square forward</p>
  </header>

  <div class="stage" id="stage" aria-label="Rooms, one square at a time, approaching from the deep"></div>

  <div class="controls-wrap">
    <div class="controls">
      <button class="nav-btn" id="backBtn" type="button">◀ Back</button>
      <div class="counter" id="counter" aria-live="polite">1 / 8</div>
      <button class="nav-btn" id="fwdBtn" type="button">Forward ▶</button>
    </div>
    <div class="dots" id="dots" aria-label="Jump to a square"></div>
  </div>

  <script>
    const FEED = [
      { tag: "Front Door", title: "True Freedom", text: "Welcome to MocGoogle. No paywalls, no sign-ups. Scroll forward to pull each room out of the deep.", btn: "Enter Store", link: "index.html", color: "#38bdf8" },
      { tag: "Game Room", title: "Brainiac Pinball", text: "Hit letters in the 30-position bumper circle, auto-spell words, and claim #1 on the board.", btn: "Play Pinball", link: "brainiac-pinball.html", color: "#facc15" },
      { tag: "The Shelves", title: "Free Books", text: "Complete original books and alternative physics works kept out in the open to read free.", btn: "Open Books", link: "index.html", color: "#4ade80" },
      { tag: "Audio Room", title: "Science Podcasts", text: "Stream free episodes on gravity, light, energy, and how the universe works.", btn: "Listen Now", link: "index.html", color: "#c084fc" },
      { tag: "Theater", title: "The Flashy Wall", text: "Moving pictures, visual experiments, Sister, and guest features.", btn: "Watch Videos", link: "index.html", color: "#f472b6" },
      { tag: "Voice Tool", title: "The Sound App", text: "Pick a voice tone, type or paste your words, and hear them spoken out loud free.", btn: "Open Sound App", link: "index.html", color: "#22d3ee" },
      { tag: "Story Room", title: "Dragons", text: "Merlin makes a baby dragon, and the whole family comes after.", btn: "Meet Dragons", link: "index.html", color: "#fb923c" },
      { tag: "Info & Help", title: "About & Contact", text: "Created by Rick Latimer in Oswego, NY. Reach out anytime or read the FAQ.", btn: "Email MocGoogle", link: "mailto:mocgoogle@mocgoogle.com", color: "#a3e635" }
    ];

    const stage = document.getElementById('stage');
    const counterEl = document.getElementById('counter');
    const dotsEl = document.getElementById('dots');

    const cards = FEED.map(item => {
      const div = document.createElement('div');
      div.className = 'card hidden-deep';
      div.style.borderColor = item.color;
      div.setAttribute('aria-hidden', 'true');
      div.innerHTML =
        '<div>' +
          '<span class="tag" style="color:' + item.color + '">' + item.tag + '</span>' +
          '<h2>' + item.title + '</h2>' +
          '<p>' + item.text + '</p>' +
        '</div>' +
        '<a class="btn" style="background:' + item.color + '" href="' + item.link + '" tabindex="-1">' + item.btn + '</a>';
      stage.appendChild(div);
      return div;
    });

    const dots = FEED.map((item, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', 'Go to square ' + (i + 1) + ': ' + item.title);
      b.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(b);
      return b;
    });

    let index = 0;
    let busy = false;

    function updateDepth() {
      const total = cards.length;
      const nextIdx = (index + 1) % total;
      const next2Idx = (index + 2) % total;
      const prevIdx = (index - 1 + total) % total;

      cards.forEach((card, i) => {
        let cls = 'card hidden-deep';
        if (i === index) cls = 'card front';
        else if (i === nextIdx) cls = 'card deep';
        else if (i === next2Idx) cls = 'card deep-2';
        else if (i === prevIdx) cls = 'card passed';
        card.className = cls;

        const isFront = i === index;
        card.setAttribute('aria-hidden', isFront ? 'false' : 'true');
        const link = card.querySelector('.btn');
        if (link) link.tabIndex = isFront ? 0 : -1;
      });

      dots.forEach((d, i) => d.classList.toggle('on', i === index));
      counterEl.textContent = (index + 1) + ' / ' + total;
    }

    function move(dir) {
      const total = cards.length;
      index = (index + dir + total) % total;
      updateDepth();
    }

    function goTo(i) {
      index = i;
      updateDepth();
    }

    document.getElementById('backBtn').addEventListener('click', () => move(-1));
    document.getElementById('fwdBtn').addEventListener('click', () => move(1));

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      move(e.deltaY > 0 ? 1 : -1);
      setTimeout(() => busy = false, 450);
    }, { passive: false });

    let startY = 0;
    let startX = 0;
    window.addEventListener('touchstart', e => {
      startY = e.touches[0].clientY;
      startX = e.touches[0].clientX;
    }, { passive: true });
    window.addEventListener('touchend', e => {
      const dy = startY - e.changedTouches[0].clientY;
      const dx = startX - e.changedTouches[0].clientX;
      if (Math.abs(dy) > 35 && Math.abs(dy) >= Math.abs(dx)) move(dy > 0 ? 1 : -1);
      else if (Math.abs(dx) > 35) move(dx > 0 ? 1 : -1);
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); move(1); }
      else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); move(-1); }
    });

    updateDepth();
  </script>
</body>
</html>
